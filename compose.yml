services:
  ocre-sdk:
    build:
      context: .
      dockerfile: Dockerfile.sdk
    container_name: ocre-sdk
    volumes:
      - ./ocre-sdk:/workspace/ocre-sdk
    stdin_open: true
    tty: true

  ocre-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ocre-dev
    volumes:
      - .:/workspace
    stdin_open: true
    tty: true
    user: root
    devices:
      - /dev:/dev
    privileged: true
    group_add:
      - dialout


